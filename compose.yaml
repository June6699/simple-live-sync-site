services:
  sync:
    build:
      context: .
    image: simple-live-sync:${SIMPLE_LIVE_SYNC_IMAGE_TAG:-current}
    container_name: simple-live-sync
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://sync.furry.mo.cn}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_DB_PATH: /app/data/metrics.sqlite
      IP_HASH_SECRET: ${IP_HASH_SECRET:-}
      GEOIP_DB_PATH: /usr/share/GeoIP/GeoLite2-City.mmdb
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /var/lib/simple-live-sync:/app/data
      - /var/lib/GeoIP:/usr/share/GeoIP:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
